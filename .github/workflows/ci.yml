name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 make

      # 多个 leetcode 子项目使用 C++23 deducing this，需要 g++-14（ubuntu 默认 g++-13 不支持）
      - name: Build all projects
        run: make CXX=g++-14

      - name: Run tests
        run: make test CXX=g++-14

      - name: Clean build artifacts
        run: make clean CXX=g++-14
